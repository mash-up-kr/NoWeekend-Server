version: "3.9"
services:
  core-api:
    image: core-api:latest
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Seoul
      - KMA_API_KEY=${KMA_API_KEY}
      - ANTHROPIC_KEY=${ANTHROPIC_KEY}
      - JASYPT_ENCRYPTOR_PASSWORD=${JASYPT_ENCRYPTOR_PASSWORD}
      - SPRING_PROFILES_ACTIVE=staging
      - SERVER_PORT=8080
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Seoul
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./secret/apple_auth_key.p8:/root/organized/app/secret/apple_auth_key.p8:ro
    networks:
      - mashupnet

  mcp-server:
    image: mcp-server:latest
    ports:
      - "8081:8081"
    environment:
      - TZ=Asia/Seoul
      - JASYPT_ENCRYPTOR_PASSWORD=${JASYPT_ENCRYPTOR_PASSWORD}
      - SERVER_PORT=8081
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Seoul
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - mashupnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp-host:
    image: mcp-host:latest
    ports:
      - "8082:8082"
    environment:
      - TZ=Asia/Seoul
      - JASYPT_ENCRYPTOR_PASSWORD=${JASYPT_ENCRYPTOR_PASSWORD}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - SERVER_PORT=8082
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Seoul
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      mcp-server:
        condition: service_healthy
    networks:
      - mashupnet

networks:
  mashupnet:
    external: true
